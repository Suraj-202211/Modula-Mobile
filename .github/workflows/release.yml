name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install patch tools
        run: sudo apt-get update && sudo apt-get install -y bsdiff

      - name: Grant Gradle permission
        run: chmod +x native-launcher/gradlew

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
        working-directory: native-launcher

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp native-launcher/ZalithLauncher/build/outputs/apk/release/*.apk \
             launcher-v${VERSION}.apk

      - name: Free Memory (Kill Gradle)
        run: |
          cd native-launcher && ./gradlew --stop || true
          sudo sysctl -w vm.drop_caches=3

      # ------------------------------------------------------------
      # Download previous release APK
      # ------------------------------------------------------------

      - name: Get previous tag
        id: prev
        run: |
          PREV=$(git tag --sort=-creatordate | grep '^v' | grep -v "${GITHUB_REF_NAME}" | head -n 1)
          echo "prev=$PREV" >> $GITHUB_OUTPUT

      - name: Download previous APK
        if: steps.prev.outputs.prev != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG="${{ steps.prev.outputs.prev }}"
          VERSION=${PREV_TAG#v}
          gh release download $PREV_TAG \
            --pattern "launcher-v${VERSION}.apk" \
            --dir previous || echo "Previous release not found or pattern mismatch"

      # ------------------------------------------------------------
      # Generate bsdiff patch
      # ------------------------------------------------------------

      - name: Allocate swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4

      - name: Generate patch
        continue-on-error: true
        if: steps.prev.outputs.prev != ''
        run: |
          NEW=${GITHUB_REF_NAME#v}
          PREV_TAG="${{ steps.prev.outputs.prev }}"
          OLD=${PREV_TAG#v}
          
          if [ -f "previous/launcher-v${OLD}.apk" ]; then
            bsdiff previous/launcher-v${OLD}.apk launcher-v${NEW}.apk launcher-v${OLD}_to_v${NEW}.patch
          else
            echo "Previous APK not downloaded, skipping patch generation."
          fi

      # ------------------------------------------------------------
      # Generate release.json
      # ------------------------------------------------------------

      - name: Generate manifest
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PREV_TAG="${{ steps.prev.outputs.prev }}"
          OLD=${PREV_TAG#v}
          
          PATCH_FILE="launcher-v${OLD}_to_v${VERSION}.patch"
          if [ ! -f "$PATCH_FILE" ]; then
            PATCH_FILE="none"
          fi

          python scripts/create_manifest.py \
            ${VERSION} \
            launcher-v${VERSION}.apk \
            ${PATCH_FILE} \
            ${{ github.repository }}

      # ------------------------------------------------------------
      # Create GitHub Release
      # ------------------------------------------------------------

      - name: Verify APK exists
        run: |
          test -f launcher-v${GITHUB_REF_NAME#v}.apk
          echo "APK verified"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            launcher-v*.apk
            launcher-v*_to_v*.patch
            release.json

      - name: Generate and Commit latest.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          APK_FILE="launcher-v${VERSION}.apk"
          
          if [ ! -f "$APK_FILE" ]; then
            echo "Error: APK file $APK_FILE not found!"
            exit 1
          fi
          
          # Fetch and checkout main branch
          git fetch origin main
          git checkout main
          
          # Extract versionCode and versionName using apkanalyzer
          APK_ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          VERSION_CODE=$($APK_ANALYZER manifest version-code "$APK_FILE")
          VERSION_NAME=$($APK_ANALYZER manifest version-name "$APK_FILE")
          
          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "Failed to extract version info from APK."
            exit 1
          fi
          
          APK_SIZE=$(stat -c%s "$APK_FILE")
          APK_SHA256=$(sha256sum "$APK_FILE" | awk '{ print $1 }' | tr '[:lower:]' '[:upper:]')
          RELEASE_DATE=$(date -u +"%Y-%m-%d")
          
          mkdir -p updates
          cat <<EOF > updates/latest.json
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "releaseNotes": [
              "Release $VERSION_NAME of Modula Mobile"
            ],
            "mandatory": false,
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$APK_FILE",
            "apkSizeBytes": $APK_SIZE,
            "apkSha256": "$APK_SHA256",
            "releaseDate": "$RELEASE_DATE"
          }
          EOF
          
          echo "Generated updates/latest.json:"
          cat updates/latest.json
          
          # Commit and push
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          git commit -m "chore: update latest release metadata [skip ci]" || echo "No changes to commit"
          git push origin main
