name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install patch tools
        run: sudo apt-get update && sudo apt-get install -y bsdiff

      - name: Grant Gradle permission
        run: chmod +x native-launcher/gradlew

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
        working-directory: native-launcher

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp native-launcher/ZalithLauncher/build/outputs/apk/release/*.apk \
             launcher-v${VERSION}.apk
          cp launcher-v${VERSION}.apk ModulaMobile.apk

      - name: Free Memory (Kill Gradle)
        run: |
          cd native-launcher && ./gradlew --stop || true
          sudo sysctl -w vm.drop_caches=3

      # ------------------------------------------------------------
      # Download previous release APK
      # ------------------------------------------------------------

      - name: Find previous release with APK
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Finding previous valid release APK..."
          PREV=""
          for tag in $(git tag --sort=-creatordate | grep '^v' | grep -v "^${GITHUB_REF_NAME}$"); do
            VERSION=${tag#v}
            echo "Checking tag $tag for launcher-v${VERSION}.apk..."
            if gh release view "$tag" --json assets -q ".assets[].name" 2>/dev/null | grep -q "launcher-v${VERSION}.apk"; then
              echo "Found matching previous release with APK: $tag"
              PREV="$tag"
              break
            fi
          done
          echo "prev=$PREV" >> $GITHUB_OUTPUT

      - name: Download previous release files
        if: steps.prev.outputs.prev != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG="${{ steps.prev.outputs.prev }}"
          VERSION=${PREV_TAG#v}
          mkdir -p previous
          gh release download $PREV_TAG \
            --pattern "launcher-v${VERSION}.apk" \
            --dir previous || echo "Previous APK not found"
          gh release download $PREV_TAG \
            --pattern "patches.json" \
            --dir . || echo "patches.json not found in previous release"

      # ------------------------------------------------------------
      # Generate bsdiff patch
      # ------------------------------------------------------------

      - name: Allocate swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4

      - name: Generate patch and verify
        if: steps.prev.outputs.prev != ''
        run: |
          NEW=${GITHUB_REF_NAME#v}
          PREV_TAG="${{ steps.prev.outputs.prev }}"
          OLD=${PREV_TAG#v}
          
          if [ -f "previous/launcher-v${OLD}.apk" ]; then
            echo "Generating patch from previous/launcher-v${OLD}.apk to launcher-v${NEW}.apk"
            bsdiff previous/launcher-v${OLD}.apk launcher-v${NEW}.apk launcher-v${OLD}_to_v${NEW}.patch
            ls -lh launcher-v${OLD}_to_v${NEW}.patch
            
            echo "Verifying generated patch..."
            bspatch previous/launcher-v${OLD}.apk reconstructed.apk launcher-v${OLD}_to_v${NEW}.patch
            
            ORIG_SHA=$(sha256sum launcher-v${NEW}.apk | awk '{print $1}')
            RECON_SHA=$(sha256sum reconstructed.apk | awk '{print $1}')
            
            if [ "$ORIG_SHA" != "$RECON_SHA" ]; then
              echo "ERROR: Patch verification failed!"
              echo "Original SHA: $ORIG_SHA"
              echo "Reconstructed SHA: $RECON_SHA"
              exit 1
            fi
            echo "Patch verified successfully!"
            rm reconstructed.apk
          else
            echo "Previous APK not downloaded, skipping patch generation."
          fi

      - name: Generate patches.json
        if: steps.prev.outputs.prev != ''
        run: |
          NEW=${GITHUB_REF_NAME#v}
          PREV_TAG="${{ steps.prev.outputs.prev }}"
          OLD=${PREV_TAG#v}
          
          PATCH_FILE="launcher-v${OLD}_to_v${NEW}.patch"
          OLD_APK="previous/launcher-v${OLD}.apk"
          NEW_APK="launcher-v${NEW}.apk"
          
          if [ -f "$PATCH_FILE" ] && [ -f "$OLD_APK" ]; then
            APK_ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
            OLD_VERSION_CODE=$($APK_ANALYZER manifest version-code "$OLD_APK" 2>/dev/null || true)
            NEW_VERSION_CODE=$($APK_ANALYZER manifest version-code "$NEW_APK" 2>/dev/null || true)
            
            PATCH_URL="https://github.com/${{ github.repository }}/releases/download/v${NEW}/${PATCH_FILE}"
            
            python scripts/update_patches_index.py \
              --index patches.json \
              --from-code "$OLD_VERSION_CODE" \
              --to-code "$NEW_VERSION_CODE" \
              --url "$PATCH_URL" \
              --patch-file "$PATCH_FILE" \
              --source-apk "$OLD_APK" \
              --target-apk "$NEW_APK"
          fi

      # ------------------------------------------------------------
      # Generate release.json
      # ------------------------------------------------------------

      - name: Generate manifest
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PREV_TAG="${{ steps.prev.outputs.prev }}"
          OLD=${PREV_TAG#v}
          
          PATCH_FILE="launcher-v${OLD}_to_v${VERSION}.patch"
          if [ ! -f "$PATCH_FILE" ]; then
            PATCH_FILE="none"
          fi

          OLD_APK="previous/launcher-v${OLD}.apk"
          OLD_VERSION_CODE=""
          if [ -f "$OLD_APK" ]; then
            APK_ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
            if [ -x "$APK_ANALYZER" ]; then
              OLD_VERSION_CODE=$($APK_ANALYZER manifest version-code "$OLD_APK" 2>/dev/null || true)
            fi
          fi

          python scripts/create_manifest.py \
            ${VERSION} \
            launcher-v${VERSION}.apk \
            ${PATCH_FILE} \
            ${{ github.repository }} \
            "$OLD_APK" \
            "$OLD_VERSION_CODE"

      # ------------------------------------------------------------
      # Create GitHub Release
      # ------------------------------------------------------------

      - name: Verify APK identity
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          test -f launcher-v${VERSION}.apk
          test -f ModulaMobile.apk
          
          SHA1=$(sha256sum launcher-v${VERSION}.apk | awk '{print $1}')
          SHA2=$(sha256sum ModulaMobile.apk | awk '{print $1}')
          
          if [ "$SHA1" != "$SHA2" ]; then
            echo "ERROR: Universal APK SHA mismatch!"
            exit 1
          fi
          echo "APK SHA verified successfully"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            launcher-v*.apk
            ModulaMobile.apk
            launcher-v*_to_v*.patch
            release.json
            patches.json

